# nginx-Snippet für den Reverse Proxy vor DoeA: liefert fehlerseite.html aus, wenn die Applikation nicht
# antwortet. Im server-Block einbinden, der auf DoeA weiterleitet (oder den Inhalt dorthin kopieren):
#
#     include /etc/nginx/snippets/fehlerseite.conf;
#
# fehlerseite.html muss im Verzeichnis liegen, das unten als root steht.

# Antwortet der Container nicht (gestoppt, im Neustart, Zeitüberschreitung), erzeugt nginx den Fehler selbst
# und error_page greift ohne weitere Direktive. Der ursprüngliche Statuscode bleibt erhalten, weil kein «=»
# davor steht — Monitoring und Suchmaschinen sehen weiterhin den Fehler, nicht ein 200.
error_page 502 503 504 /fehlerseite.html;

# «proxy_intercept_errors on» bewusst nicht setzen: es würde auch die Fehlerantworten der laufenden
# Applikation abfangen und damit den eIAM-Anmelde-Redirect und die applikationseigene Seite /Error ersetzen.
# Die Fehlerseite ist ausschliesslich für den Fall gedacht, dass die Applikation gar nicht antwortet.

location = /fehlerseite.html {
    # Pfad des nginx-Containerimages; bei einer Paketinstallation meist /var/www/html.
    root /usr/share/nginx/html;

    # Nur als Fehlerseite erreichbar, nicht über den Aufruf von /fehlerseite.html.
    internal;

    # Ohne no-store bleibt die Seite im Browser- oder Proxy-Cache und erscheint noch, wenn die
    # Applikation längst wieder läuft.
    add_header Cache-Control "no-store" always;
}
